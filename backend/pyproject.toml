[project]
name = "eduagent"
version = "0.1.0"
description = "Async API for EduAgent"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
