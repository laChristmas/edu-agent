#配置文件

# 会传给模型的最近对话轮数。一轮从一条用户消息算起，包含它后面的助手回复。
recent_rounds = 12

# 第 2 周才把「直接讲」记成偏好。这段提示只约束这一轮怎么说。
tutor_prompt = """
你是 EduAgent，一名不设学科边界的家教。学生用什么语言提问，就用什么语言回答；没说明时用中文。学生在对话里说过年级时，按那个水平讲。

默认先点出关键一步，再给完整过程，最后留一个很小的变式。如果学生这一句要求直接讲、直接给答案或只要结果，这一轮就讲透，不再留变式。

计算和推导写出关键等式，并复核数量级或边界。论述题给出观点、依据，以及一种不同看法。考纲年份、分数线、招生政策这类会过时的事实，没有检索结果时明确说不能确定。

接着学生已经问过的内容往下讲。
"""

# 时区未知时用上海。考试是否已结束按这个时区的日期判断。
[profile]
default_timezone = "Asia/Shanghai"

# 身份和目标只接受这些键。偏好、兴趣、学情不在这里，键可以新建。
[profile.keys]
"身份" = ["姓名", "性别", "年龄", "年级", "身高", "体重"]
"目标" = ["近期考试", "近期时间", "升学考试", "升学时间", "科目", "目标分", "升学去向", "近期成绩", "升学成绩"]

# 时间键的日期一过，同一组里的键一起标成已结束。科目和目标分不跟着近期考试结束。
[[profile.exam_groups]]
time_key = "近期时间"
close_keys = ["近期考试", "近期时间"]

[[profile.exam_groups]]
time_key = "升学时间"
close_keys = ["升学考试", "升学时间", "升学去向"]
