services:
  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: missing
    environment:
      POSTGRES_USER: eduagent
      POSTGRES_PASSWORD: eduagent
      POSTGRES_DB: eduagent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduagent -d eduagent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - eduagent_pg:/var/lib/postgresql/data

volumes:
  eduagent_pg:
